<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">Tusyndon Industrial Software product portfolio</title>
  <desc id="description">SolidDesigner connects parametric design with Tusyndon products for drawings, model review, manufacturing, simulation, BIM, and engineering innovation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.52" stop-color="#07182b"/>
      <stop offset="1" stop-color="#08101c"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5cff"/>
      <stop offset="1" stop-color="#18cbe8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1edcff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1edcff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a82b3" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.52"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="32" fill="url(#background)"/>
  <rect width="1400" height="820" rx="32" fill="url(#grid)"/>
  <ellipse cx="700" cy="420" rx="460" ry="210" fill="#0a5cff" opacity="0.12" filter="url(#softGlow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="78" fill="#7f96ad" font-size="18" font-weight="700" letter-spacing="4">TUSYNDON INDUSTRIAL SOFTWARE</text>
    <text x="72" y="122" fill="#f4f8fc" font-size="34" font-weight="700">Engineering software portfolio</text>
    <text x="1328" y="88" text-anchor="end" fill="#20d9ff" font-size="15" font-weight="700" letter-spacing="2">DESIGN → ENGINEER → DELIVER</text>

    <path d="M 318 280 C 415 280 430 350 510 365" fill="none" stroke="#20d9ff" stroke-opacity="0.46" stroke-width="2"/>
    <path d="M 318 625 C 415 625 430 520 510 500" fill="none" stroke="#20d9ff" stroke-opacity="0.46" stroke-width="2"/>
    <path d="M 1082 280 C 985 280 970 350 890 365" fill="none" stroke="#ff8a3d" stroke-opacity="0.46" stroke-width="2"/>
    <path d="M 1082 625 C 985 625 970 520 890 500" fill="none" stroke="#ff8a3d" stroke-opacity="0.46" stroke-width="2"/>
    <circle cx="318" cy="280" r="5" fill="#20d9ff"/>
    <circle cx="318" cy="625" r="5" fill="#20d9ff"/>
    <circle cx="1082" cy="280" r="5" fill="#ff8a3d"/>
    <circle cx="1082" cy="625" r="5" fill="#ff8a3d"/>

    <g filter="url(#cardShadow)">
      <rect x="70" y="190" width="248" height="182" rx="20" fill="#0b1a2b" stroke="#1f6282" stroke-opacity="0.62"/>
      <rect x="70" y="190" width="5" height="182" rx="3" fill="#20d9ff"/>
      <text x="98" y="230" fill="#20d9ff" font-size="14" font-weight="700" letter-spacing="1.8">DRAWING AUTOMATION</text>
      <text x="98" y="273" fill="#f5f8fc" font-size="20" font-weight="700">Drawing Nester</text>
      <text x="98" y="302" fill="#f5f8fc" font-size="20" font-weight="700">Drawing Publisher</text>
      <text x="98" y="340" fill="#8499ae" font-size="14">Layout · batch output · delivery</text>

      <rect x="70" y="536" width="248" height="182" rx="20" fill="#0b1a2b" stroke="#1f6282" stroke-opacity="0.62"/>
      <rect x="70" y="536" width="5" height="182" rx="3" fill="#20d9ff"/>
      <text x="98" y="576" fill="#20d9ff" font-size="14" font-weight="700" letter-spacing="1.8">MODEL INTELLIGENCE</text>
      <text x="98" y="619" fill="#f5f8fc" font-size="20" font-weight="700">PMI Reviewer</text>
      <text x="98" y="648" fill="#f5f8fc" font-size="20" font-weight="700">Assembly Architect</text>
      <text x="98" y="686" fill="#8499ae" font-size="14">MBD review · interface mapping</text>

      <rect x="1082" y="190" width="248" height="182" rx="20" fill="#171523" stroke="#8a4f31" stroke-opacity="0.7"/>
      <rect x="1325" y="190" width="5" height="182" rx="3" fill="#ff8a3d"/>
      <text x="1108" y="230" fill="#ff9d60" font-size="14" font-weight="700" letter-spacing="1.8">MANUFACTURING</text>
      <text x="1108" y="273" fill="#f5f8fc" font-size="17" font-weight="700">Sheet Metal Nester</text>
      <text x="1108" y="302" fill="#f5f8fc" font-size="17" font-weight="700">Pressure Vessel Designer</text>
      <text x="1108" y="340" fill="#a99aa2" font-size="14">Nesting · design · simulation</text>

      <rect x="1082" y="536" width="248" height="182" rx="20" fill="#171523" stroke="#8a4f31" stroke-opacity="0.7"/>
      <rect x="1325" y="536" width="5" height="182" rx="3" fill="#ff8a3d"/>
      <text x="1108" y="576" fill="#ff9d60" font-size="14" font-weight="700" letter-spacing="1.8">BIM &amp; INNOVATION</text>
      <text x="1108" y="615" fill="#f5f8fc" font-size="17" font-weight="700">IFC Editor · Compare</text>
      <text x="1108" y="642" fill="#f5f8fc" font-size="17" font-weight="700">IFC Takeoff</text>
      <text x="1108" y="669" fill="#f5f8fc" font-size="17" font-weight="700">TRIZ Studio</text>
      <text x="1108" y="699" fill="#a99aa2" font-size="14">Engineering data · methods</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="445" y="248" width="510" height="350" rx="34" fill="#081827" stroke="#20d9ff" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="470" y="273" width="460" height="300" rx="26" fill="#07111f" stroke="#3c6e8e" stroke-opacity="0.45"/>
      <rect x="470" y="273" width="460" height="6" rx="3" fill="url(#platform)"/>
      <circle cx="700" cy="362" r="76" fill="#0a5cff" opacity="0.28" filter="url(#softGlow)"/>
      <path d="M 651 373 L 681 321 L 741 321 L 771 373 L 741 425 L 681 425 Z" fill="none" stroke="#20d9ff" stroke-width="3"/>
      <path d="M 668 373 L 690 337 L 732 337 L 753 373 L 732 409 L 690 409 Z" fill="#0a5cff" fill-opacity="0.25" stroke="#f7fbff" stroke-opacity="0.82" stroke-width="2"/>
      <circle cx="711" cy="373" r="13" fill="#ff8a3d"/>
      <text x="700" y="475" text-anchor="middle" fill="#f7fbff" font-size="42" font-weight="750" letter-spacing="0.5">SolidDesigner</text>
      <text x="700" y="511" text-anchor="middle" fill="#20d9ff" font-size="15" font-weight="700" letter-spacing="2.2">PARAMETRIC ENGINEERING PLATFORM</text>
      <text x="700" y="544" text-anchor="middle" fill="#8299af" font-size="15">Feature history · B-Rep geometry · extensible workbenches</text>
    </g>

    <rect x="392" y="750" width="616" height="2" fill="url(#edge)"/>
    <text x="700" y="786" text-anchor="middle" fill="#7f96ad" font-size="15" letter-spacing="1.1">FROM ENGINEERING INTENT TO MANUFACTURING-READY DELIVERABLES</text>
  </g>
</svg>
