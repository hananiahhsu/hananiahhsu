<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Tusyndon engineering software product system</title>
  <desc id="description">The product system presents SolidDesigner alongside Tusyndon product families for drawing automation, model intelligence, manufacturing engineering, and BIM innovation.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5fd"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082b68"/>
      <stop offset="0.62" stop-color="#0b63ce"/>
      <stop offset="1" stop-color="#009e95"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082b68"/>
      <stop offset="0.45" stop-color="#0b63ce"/>
      <stop offset="1" stop-color="#12b9a5"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#2c6faf" stroke-opacity="0.07"/>
    </pattern>
